# Alembic configuration for the Pathfinder long-term store.
#
# Run from the repository root:
#   uv run alembic -c backend/db/alembic.ini upgrade head          # needs PostgreSQL + pgvector
#   uv run alembic -c backend/db/alembic.ini upgrade head --sql    # offline: prints the SQL only
#
# The database URL is NOT stored here; migrations/env.py reads it from
# backend.settings.get_settings().database_url (env var PATHFINDER_DATABASE_URL or .env).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# Zero-padded revision ids sort naturally in the file listing.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
