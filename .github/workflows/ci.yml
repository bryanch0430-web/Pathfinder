name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      # requirements.lock pins every package requirements.txt asks for, the test tools
      # (pytest, pytest-asyncio, anyio) included. The optional RAG packages (torch,
      # transformers) are not installed: the app falls back to the lexical retriever.
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.lock

      # ENVIRONMENT=test lets the app start with the repository's default
      # AUTH_SECRET and ADMIN_TOKEN (see Settings.check_secrets).
      - name: Run tests
        working-directory: backend
        env:
          ENVIRONMENT: test
          PYTHONPATH: .
        run: python -m pytest -o addopts="" -q

      # Installed after the tests so the audit tool is not part of the environment they ran in.
      - name: Audit packages
        run: python -m pip install pip-audit && pip-audit -r backend/requirements.lock

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Build Storybook
        working-directory: frontend
        run: npm run build-storybook

      - name: Audit packages
        working-directory: frontend
        run: npm audit --audit-level=high
